name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Bibliotecas de sistema do Qt e um servidor X virtual (Xvfb) com OpenGL por
      # software (Mesa) para os testes de interface no Linux; Windows e macOS têm tela.
      - name: Dependências do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglu1-mesa libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[ui,dev]"
      - run: ruff check .
      # A saída vai para pytest.log; se falhar, as falhas e o ponto de uma queda do
      # processo viram anotações (aparecem na página do commit, sem precisar de login).
      - name: Testes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            run="xvfb-run -a -s '-screen 0 1920x1080x24'"
          else
            run=""
          fi
          set +e
          eval $run python -X faulthandler -m pytest -v -rfE -p no:cacheprovider > pytest.log 2>&1
          code=$?
          set -e
          tail -n 60 pytest.log
          if [ $code -ne 0 ]; then
            python .github/anotar_falhas.py pytest.log $code
          fi
          exit $code

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar Signed-off-by em todos os commits
        run: |
          falhou=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Commit $c sem Signed-off-by (use git commit -s)"; falhou=1
            fi
          done
          exit $falhou
